<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 无背景：透明底，直接透出页面底色（亮/暗主题都适配） -->

  <!-- 蟑螂身体（偏左，椭圆形）；加细描边，浅色主题下也能看清轮廓 -->
  <ellipse cx="80" cy="120" rx="35" ry="50" fill="#E8D4B8" stroke="#A08A68" stroke-width="2"/>

  <!-- 右侧翻页三角形 -->
  <polygon points="115,80 165,120 115,160" fill="#FFF8DC" stroke="#D4C4A8" stroke-width="2"/>

  <!-- 翻页折痕 -->
  <line x1="115" y1="80" x2="115" y2="160" stroke="#C4B49A" stroke-width="2"/>

  <!-- 头部（圆形，在上方） -->
  <circle cx="85" cy="55" r="20" fill="#D4C4A8" stroke="#A08A68" stroke-width="2"/>

  <!-- 触角（不对称，从头部上方伸出） -->
  <path d="M 75 35 Q 60 15 40 25" fill="none" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <path d="M 95 35 Q 110 10 130 20" fill="none" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>

  <!-- 文字行（在身体左侧） -->
  <line x1="55" y1="105" x2="95" y2="110" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="120" x2="92" y2="125" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="135" x2="95" y2="140" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 左侧腿（三条） -->
  <line x1="50" y1="95" x2="25" y2="80" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
  <line x1="45" y1="120" x2="15" y2="120" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="145" x2="28" y2="162" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>

  <!-- 右侧腿（两条，不对称） -->
  <line x1="115" y1="100" x2="140" y2="90" stroke="#8B7355" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="118" y1="130" x2="142" y2="138" stroke="#8B7355" stroke-width="3.5" stroke-linecap="round"/>
</svg>
